[project]
name = "dave"
version = "0.1.0"
description = "Dave, an AI travel agent that plans RV road trips."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dave = "dave.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
